<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法国 + 意大利 16日旅行手册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --accent-color: #ff6b6b;
            --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --success-color: #51cf66;
            --warning-color: #ffd93d;
        }

        body.dark-mode {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #404040;
            --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== 顶部信息栏 ===== */
        .header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .header-item {
            text-align: center;
        }

        .header-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .header-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-subvalue {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .weather-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 16px;
            transition: transform 0.2s;
        }

        .weather-btn:hover {
            transform: scale(1.1);
        }

        /* ===== 倒计时卡片 ===== */
        .countdown-card {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .countdown-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .countdown-subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .countdown-timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .countdown-unit {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px 10px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .countdown-number {
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
        }

        .countdown-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===== 切换主题按钮 ===== */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-color);
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* ===== 行程地图 ===== */
        .itinerary-map {
            background-color: var(--bg-secondary);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .itinerary-map h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .map-svg {
            width: 100%;
            min-height: 400px;
        }

        /* ===== 日期卡片 ===== */
        .day-section {
            margin-bottom: 40px;
            padding: 25px;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .day-header:hover {
            transform: translateX(5px);
        }

        .day-date {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .day-title {
            font-size: 18px;
            font-weight: 600;
            margin: 10px 0;
        }

        .day-route {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .expand-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-primary);
            transition: transform 0.3s ease;
        }

        .expand-btn.expanded {
            transform: rotate(180deg);
        }

        /* ===== 当日信息卡片 ===== */
        .info-card {
            background-color: var(--bg-primary);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-color);
            display: none;
        }

        .info-card.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-color);
        }

        .info-content {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .info-item {
            margin-bottom: 10px;
            padding-left: 15px;
            position: relative;
        }

        .info-item::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--accent-color);
        }

        .clickable {
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
            transition: opacity 0.2s;
        }

        .clickable:hover {
            opacity: 0.7;
        }

        /* ===== 时间线 ===== */
        .timeline {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .timeline.show {
            display: block;
        }

        .timeline-item {
            display: flex;
            margin-bottom: 20px;
            position: relative;
        }

        .timeline-time {
            width: 80px;
            font-weight: 600;
            color: var(--accent-color);
            flex-shrink: 0;
        }

        .timeline-content {
            flex: 1;
            padding-left: 20px;
            border-left: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .timeline-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--accent-color);
            left: -7px;
            top: 5px;
            border: 3px solid var(--bg-primary);
        }

        /* ===== 待办清单 ===== */
        .todo-section {
            background-color: var(--bg-secondary);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .todo-section h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            padding: 12px 0;
            padding-left: 20px;
            position: relative;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            line-height: 1.6;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-item::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--success-color);
            font-weight: 700;
        }

        /* ===== 提示部分 ===== */
        .tips-section {
            background-color: var(--bg-secondary);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .tips-section h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .tip-item {
            margin-bottom: 15px;
            padding: 15px;
            background-color: var(--bg-primary);
            border-radius: 8px;
            border-left: 4px solid var(--warning-color);
        }

        .tip-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .tip-content {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* ===== 响应式设计 ===== */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                padding: 15px;
            }

            .header-value {
                font-size: 16px;
            }

            .countdown-timer {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .countdown-number {
                font-size: 28px;
            }

            .theme-toggle {
                width: 45px;
                height: 45px;
                font-size: 20px;
                top: 15px;
                right: 15px;
            }

            .day-section {
                padding: 15px;
            }

            .timeline-time {
                width: 60px;
                font-size: 12px;
            }
        }

        /* ===== 打印样式 ===== */
        @media print {
            .theme-toggle,
            .expand-btn {
                display: none;
            }

            .info-card {
                display: block !important;
            }

            .timeline {
                display: block !important;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">

            </div>
            <div class="header-item">

            </div>
            <div class="header-item">

                <div class="header-value" id="weatherIcon">☀️</div>

                <div class="countdown-unit">
                    <div class="countdown-number" id="hours">0</div>
                    <div class="countdown-label">小时</div>

                    <div class="countdown-label">分钟</div>
                </div>

        <!-- 行程地图 -->
        <div class="itinerary-map">
            <h2>🗺️ 行程总览</h2>

                <!-- 背景 -->
                <defs>
                    <style>
                        .map-bg { fill: #f0f4f8; }
                        .map-line { stroke: #ff6b6b; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }

                        .map-day { font-size: 12px; text-anchor: middle; font-weight: 500; }

                </defs>
                <rect width="1000" height="400" class="map-bg" />

                <!-- 路线 D1-D16 -->

                <text class="map-day" x="450" y="320">D5-D6</text>

    <script>
        // ===== 主题切换 =====
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            const isDark = html.getAttribute('data-theme') === 'dark';
            if (isDark) {
                html.removeAttribute('data-theme');
                document.body.classList.remove('dark-mode');
                themeToggle.textContent = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                document.body.classList.add('dark-mode');
                themeToggle.textContent = '☀️';
            }
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        });

        // 加载保存的主题
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            html.setAttribute('data-theme', 'dark');
            document.body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        }

        // ===== 时间更新函数 =====
        function updateTime() {
            const now = new Date();
            
            // 北京时间
            const beijingTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
            document.getElementById('currentDate').textContent = beijingTime.toLocaleDateString('zh-CN');
            
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            document.getElementById('currentWeekday').textContent = weekdays[beijingTime.getDay()];
            
            document.getElementById('beijingTime').textContent = beijingTime.toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            // 当地时间（欧洲中欧时间）
            const localTime = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Paris' }));
            document.getElementById('localTime').textContent = localTime.toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            // 时区名称
            const isSummerTime = (month) => month >= 3 && month < 10;
            const month = localTime.getMonth();
            document.getElementById('timezoneName').textContent = isSummerTime(month) ? 'CEST (UTC+2)' : 'CET (UTC+1)';

            // 更新倒计时
            updateCountdown();
        }

        // ===== 倒计时函数 =====
        function updateCountdown() {
            const startDate = new Date('2026-09-06T00:00:00+08:00');
            const now = new Date();
            const diff = startDate - now;

            if (diff <= 0) {
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
                document.getElementById('nextEvent').textContent = '旅程已开始！';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            document.getElementById('nextEvent').textContent = `距离出发还有`;
        }

        // 每秒更新
        setInterval(updateTime, 1000);
        updateTime();

        // ===== 渲染行程卡片 =====
        function renderItinerary() {
            const container = document.getElementById('daysContainer');
            container.innerHTML = '';

            itinerary.forEach(day => {
                const daySection = document.createElement('div');
                daySection.className = 'day-section';

                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';

                const headerContent = document.createElement('div');
                headerContent.style.flex = '1';

                const dayDate = document.createElement('div');
                dayDate.className = 'day-date';
                dayDate.textContent = `D${day.day} | ${day.date}`;

                const dayTitle = document.createElement('div');
                dayTitle.className = 'day-title';
                dayTitle.textContent = day.route;

                const dayRoute = document.createElement('div');
                dayRoute.className = 'day-route';
                dayRoute.textContent = day.cities;

                headerContent.appendChild(dayDate);
                headerContent.appendChild(dayTitle);
                headerContent.appendChild(dayRoute);

                const expandBtn = document.createElement('button');
                expandBtn.className = 'expand-btn';
                expandBtn.textContent = '▼';

                dayHeader.appendChild(headerContent);
                dayHeader.appendChild(expandBtn);

                // 交通信息
                const transportCard = document.createElement('div');
                transportCard.className = 'info-card';
                transportCard.innerHTML = '<div class="info-title">✈️ 交通</div><div class="info-content">' +
                    day.transport.map(t => `<div class="info-item"><strong>${t.type}:</strong> ${t.detail}</div>`).join('') +
                    '</div>';

                // 酒店信息
                const hotelCard = document.createElement('div');
                hotelCard.className = 'info-card';
                hotelCard.innerHTML = `<div class="info-title">🏨 酒店</div><div class="info-content">
                    <div class="info-item"><strong>${day.hotel.name}</strong></div>
                    <div class="info-item">入住: ${day.hotel.checkin} | 离店: ${day.hotel.checkout}</div>
                </div>`;

                // 当日活动
                const activitiesCard = document.createElement('div');
                activitiesCard.className = 'info-card';
                activitiesCard.innerHTML = '<div class="info-title">🎯 当日活动</div><div class="info-content">' +
                    day.activities.map(a => `<div class="info-item">${a}</div>`).join('') +
                    '</div>';

                // 备注
                const notesCard = document.createElement('div');
                notesCard.className = 'info-card';
                if (day.notes) {
                    notesCard.innerHTML = `<div class="info-title">📌 备注</div><div class="info-content">
                        <div class="info-item">${day.notes}</div>
                    </div>`;
                }

                // 时间线
                const timeline = document.createElement('div');
                timeline.className = 'timeline';
                timeline.innerHTML = day.activities.map((activity, idx) => {
                    const time = activity.match(/^\d{1,2}:\d{2}/) ? activity.match(/^\d{1,2}:\d{2}/)[0] : '--:--';
                    const content = activity.replace(/^\d{1,2}:\d{2}\s*/, '');
                    return `
                        <div class="timeline-item">
                            <div class="timeline-time">${time}</div>
                            <div class="timeline-content">
                                <div class="timeline-dot"></div>
                                ${content}
                            </div>
                        </div>
                    `;
                }).join('');

                dayHeader.addEventListener('click', () => {
                    const isExpanded = transportCard.classList.contains('show');
                    if (isExpanded) {
                        transportCard.classList.remove('show');
                        hotelCard.classList.remove('show');
                        activitiesCard.classList.remove('show');
                        if (day.notes) notesCard.classList.remove('show');
                        timeline.classList.remove('show');
                        expandBtn.classList.remove('expanded');
                    } else {
                        transportCard.classList.add('show');
                        hotelCard.classList.add('show');
                        activitiesCard.classList.add('show');
                        if (day.notes) notesCard.classList.add('show');
                        timeline.classList.add('show');
                        expandBtn.classList.add('expanded');
                    }
                });

                daySection.appendChild(dayHeader);
                daySection.appendChild(transportCard);
                daySection.appendChild(hotelCard);
                daySection.appendChild(activitiesCard);
                if (day.notes) daySection.appendChild(notesCard);
                daySection.appendChild(timeline);

                container.appendChild(daySection);
            });
        }

        const tipsContainer = document.getElementById('tipsContainer');
        tips.forEach(tip => {
            const tipDiv = document.createElement('div');
            tipDiv.className = 'tip-item';
            tipDiv.innerHTML = `<div class="tip-title">${tip.title}</div><div class="tip-content">${tip.content}</div>`;
            tipsContainer.appendChild(tipDiv);
        });

        // ===== 天气按钮 =====
        document.getElementById('weatherBtn').addEventListener('click', () => {
            // iOS 天气 app URL scheme
            const iosUrl = 'weather://';
            // 备用：Google 天气查询
            const webUrl = 'https://www.google.com/search?q=weather+in+paris';
            
            if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
                window.location.href = iosUrl;
                setTimeout(() => {
                    window.location.href = webUrl;
                }, 500);
            } else {
                window.open(webUrl, '_blank');
            }
        });

        // ===== 初始化 =====
        renderItinerary();
    </script>
